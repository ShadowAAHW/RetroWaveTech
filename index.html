<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroWave Tech Store</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="logo">RetroWave<span>Tech</span></div>
        <nav class="nav">
            <a onclick="Router('home')">Каталог</a>
            <a onclick="Router('favorites')">Избранное</a>
            <a onclick="Router('game')">Игра</a>
            <a onclick="Router('cart')">Корзина (<span id="cart-count">0</span>)</a>
            <a onclick="Router('profile')">Профиль</a>
        </nav>
        <div class="controls">
            <button id="theme-toggle"><i class="fas fa-moon"></i></button>
            <button id="accessibility-toggle"><i class="fas fa-eye"></i></button>
        </div>
    </header>

    <main id="app">
        
    </main>
    <script src="js/state.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
